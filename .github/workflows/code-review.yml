name: Code Review

on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! $PR_TITLE =~ ^(feat|fix|docs|style|refactor|perf|test|chore|revert)([!])?[:\s].+$ ]]; then
            echo "::error::PR title must follow conventional commits format (e.g., 'feat: add new feature')"
            exit 1
          fi
      
      - name: Check PR description
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [[ -z "$PR_BODY" ]]; then
            echo "::warning::PR description is empty. Please add a description."
          fi
      
      - name: Check for WIP
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ $PR_TITLE == *"WIP"* ]] || [[ $PR_TITLE == *"wip"* ]]; then
            echo "::warning::PR title contains 'WIP'. This PR should not be merged yet."
          fi

  size-check:
    name: Check PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check files changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | wc -l)
          echo "Changed files: $CHANGED_FILES"
          
          if [[ $CHANGED_FILES -gt 20 ]]; then
            echo "::warning::This PR changes $CHANGED_FILES files. Consider splitting into smaller PRs."
          fi
      
      - name: Check lines changed
        run: |
          LINES_ADDED=$(git diff --numstat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | awk '{sum+=$1} END {print sum}')
          LINES_REMOVED=$(git diff --numstat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | awk '{sum+=$2} END {print sum}')
          TOTAL_LINES=$((LINES_ADDED + LINES_REMOVED))
          
          echo "Lines added: $LINES_ADDED"
          echo "Lines removed: $LINES_REMOVED"
          echo "Total lines changed: $TOTAL_LINES"
          
          if [[ $TOTAL_LINES -gt 500 ]]; then
            echo "::warning::This PR changes $TOTAL_LINES lines. Consider splitting into smaller PRs."
          fi

  lint:
    name: Lint PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm lint

  test:
    name: Test PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: "file:./dev.db"
          DIRECT_URL: "file:./dev.db"
      
      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: "file:./dev.db"
          DIRECT_URL: "file:./dev.db"

  coverage:
    name: Check Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: "file:./dev.db"
          DIRECT_URL: "file:./dev.db"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  review:
    name: Request Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, size-check, lint, test, coverage, security]
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    
    steps:
      - name: Request review from CODEOWNERS
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            // Get CODEOWNERS file
            const codeowners = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/CODEOWNERS',
            });
            
            // Parse CODEOWNERS and request reviews
            // This is a simplified version - in practice, you'd parse the file
            // and match changed files to owners
            
            console.log('Requesting reviews from maintainers...');
            
            // For now, just request from the repo owner
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: [context.repo.owner],
            });

  auto-approve:
    name: Auto-Approve Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, size-check, lint, test, coverage, security]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    
    steps:
      - name: Approve Dependabot PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
            });
            
            console.log('Approved Dependabot PR');
